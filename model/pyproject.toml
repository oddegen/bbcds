[project]
name = "bbcds-model"
version = "0.1.0"
description = "Public-safe BBCDS model training tooling"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.26.0",
    "imagehash>=4.3.2",
    "jsonschema>=4.23.0",
    "numpy>=1.26.4,<2.0",
    "pandas>=2.2.2",
    "pillow>=10.4.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.5.1",
    "tensorflow>=2.16.1,<2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.11.1",
    "pytest>=8.3.2",
    "ruff>=0.5.6",
]

[tool.pytest.ini_options]
strict = true
testpaths = ["tests"]
